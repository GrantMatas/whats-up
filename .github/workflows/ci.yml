name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run package
      - run: npm run audit:release
      - name: Verify empty packaged startup
        run: node scripts/smoke.mjs "release/win-unpacked/What's Up.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-distribution
          path: |
            release/Whats-Up*.exe
            release/SHA256SUMS.txt
            release/PRIVACY-AUDIT.json
          if-no-files-found: error
